<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Bento Box Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .bento-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 150px);
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .bento-item {
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .bento-item:hover {
            transform: scale(1.02);
        }
        
        .item1 {
            grid-column: span 2;
            grid-row: span 1;
            background-color: #FF6B6B;
        }
        
        .item2 {
            grid-column: span 1;
            grid-row: span 2;
            background-color: #4ECDC4;
        }
        
        .item3 {
            grid-column: span 1;
            grid-row: span 1;
            background-color: #FF9F1C;
        }
        
        .item4 {
            grid-column: span 2;
            grid-row: span 2;
            background-color: #1A535C;
        }
        
        .item5 {
            grid-column: span 1;
            grid-row: span 1;
            background-color: #7B2CBF;
        }
        
        .item6 {
            grid-column: span 2;
            grid-row: span 1;
            background-color: #2EC4B6;
        }
        
        .item7 {
            grid-column: 1/-1;
            grid-row: span 1;
            background-color: #E71D36;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; margin-bottom: 30px;">Bento Box Grid Layout</h1>
    
    <div class="bento-container">
        <div class="bento-item item1">
            <h2>Item 1</h2>
            <p>Spans 2 columns, 1 row</p>
        </div>
        
        <div class="bento-item item2">
            <h2>Item 2</h2>
            <p>Spans 1 column, 2 rows</p>
        </div>
        
        <div class="bento-item item3">
            <h2>Item 3</h2>
            <p>Spans 1 column, 1 row</p>
        </div>
        
        <div class="bento-item item4">
            <h2>Item 4</h2>
            <p>Spans 2 columns, 2 rows</p>
        </div>
        
        <div class="bento-item item5">
            <h2>Item 5</h2>
            <p>Spans 1 column, 1 row</p>
        </div>
        
        <div class="bento-item item6">
            <h2>Item 6</h2>
            <p>Spans 2 columns, 1 row</p>
        </div>
        
        <div class="bento-item item7">
            <h2>Item 7</h2>
            <p>Spans 4 column, 1 row</p>
        </div>
    </div>
</body>
</html>
