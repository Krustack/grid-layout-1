<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Grid Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
            width: 90%;
            max-width: 600px;
        }

        .grid-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0078d4;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            text-align: center;
        }

        .item1 {
            grid-column: span 2;
            grid-row: span 2;
        }

        .item2 {
            grid-column: span 2;
        }

        .item3 {
            grid-row: span 2;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item item1">Large Element (2x2)</div>
        <div class="grid-item item2">Wide Element (2x1)</div>
        <div class="grid-item item3">Tall Element (1x2)</div>
        <div class="grid-item">Small Element</div>
        <div class="grid-item">Small Element</div>
        <div class="grid-item">Small Element</div>
        <div class="grid-item">Small Element</div>
    </div>
</body>
</html>
